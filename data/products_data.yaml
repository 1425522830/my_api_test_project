# 商品列表测试
product_list_tests:
  - name: "默认列表"
    params: {}
    expected_status: 200
    expect_products: true

  - name: "limit=1"
    params: {limit: 1}
    expected_status: 200
    max_items: 1

  - name: "limit=2"
    params: {limit: 2}
    expected_status: 200
    max_items: 2

  - name: "limit=3"
    params: {limit: 3}
    expected_status: 200
    max_items: 3

  - name: "limit=5"
    params: {limit: 5}
    expected_status: 200
    max_items: 5

  - name: "limit=10"
    params: {limit: 10}
    expected_status: 200
    max_items: 10

  - name: "limit=15"
    params: {limit: 15}
    expected_status: 200
    max_items: 15

  - name: "limit=20"
    params: {limit: 20}
    expected_status: 200
    max_items: 20

  - name: "limit=30"
    params: {limit: 30}
    expected_status: 200
    max_items: 30

  - name: "limit=0"
    params: {limit: 0}
    expected_status: 200
    expect_products: true

  - name: "limit=负数"
    params: {limit: -5}
    expected_status: 200

  - name: "skip=0, limit=5"
    params: {skip: 0, limit: 5}
    expected_status: 200
    exact_items: 5

  - name: "skip=5, limit=5"
    params: {skip: 5, limit: 5}
    expected_status: 200
    exact_items: 5

  - name: "skip=10, limit=5"
    params: {skip: 10, limit: 5}
    expected_status: 200
    exact_items: 5

  - name: "skip=15, limit=10"
    params: {skip: 15, limit: 10}
    expected_status: 200
    exact_items: 10

  - name: "skip=999999"
    params: {skip: 999999, limit: 10}
    expected_status: 200
    expect_products_empty: true

  - name: "select=title,price"
    params: {select: "title,price"}
    expected_status: 200

  - name: "select=id,title,brand,price"
    params: {select: "id,title,brand,price"}
    expected_status: 200

  - name: "sortBy=price&order=asc"
    params: {sortBy: "price", order: "asc"}
    expected_status: 200

  - name: "sortBy=price&order=desc"
    params: {sortBy: "price", order: "desc"}
    expected_status: 200

# 商品搜索测试
search_tests:
  - name: "搜索 phone"
    keyword: "phone"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 laptop"
    keyword: "laptop"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 watch"
    keyword: "watch"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 apple"
    keyword: "apple"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 samsung"
    keyword: "samsung"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 nike"
    keyword: "nike"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 Essence"
    keyword: "Essence"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 Apple"
    keyword: "Apple"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 laptop case insensitive"
    keyword: "LAPTOP"
    expected_status: 200
    expect_any_match: true

  - name: "搜索 mixed 中文"
    keyword: "手机"
    expected_status: 200
    expect_any_match: false

  - name: "搜索空字符串"
    keyword: ""
    expected_status: 200
    expect_products: true

  - name: "搜索不存在的词"
    keyword: "xyzabc123"
    expected_status: 200
    expect_products_empty: true

  - name: "搜索特殊符号"
    keyword: "!@#$%"
    expected_status: 200
    expect_products_empty: true

  - name: "搜索超长词（200个a）"
    keyword: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    expected_status: 200
    expect_products_empty: true

  - name: "搜索单个字符 'a'"
    keyword: "a"
    expected_status: 200
    expect_any_match: false

  - name: "搜索数字 '123'"
    keyword: "123"
    expected_status: 200
    expect_any_match: false

