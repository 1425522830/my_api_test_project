security_cases:
  - case_name: "终止指定的活动会话"
    token_id: 7847
    expect_status: 404                  # 不建议接口自动化测此用例，对应 id 终止过后就不存在了

  - case_name: "终止不存在或者已过期的会话"
    token_id: 999999
    expect_status: 404

  - case_name: "终止所有其他会话"
    action: "revoke_all"
    expect_status: 204