notification_privacy_cases:
  - case_name: "通知设置-开启我的主题标题被更改"
    preference_key: "notify_discussionRenamed_alert"
    preference_value: true
    expect_status: 200
  - case_name: "通知设置-关闭我的主题标题被更改"
    preference_key: "notify_discussionRenamed_alert"
    preference_value: false
    expect_status: 200
  - case_name: "通知设置-开启我关注的主题有新回复"
    preference_key: "notify_newPost_alert"
    preference_value: true
    expect_status: 200
  - case_name: "通知设置-关闭我关注的主题有新回复"
    preference_key: "notify_newPost_alert"
    preference_value: false
    expect_status: 200
  - case_name: "隐私设置-开启公开我的在线状态"
    preference_key: "discloseOnline"
