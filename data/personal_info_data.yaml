# 个人设置-更改昵称测试用例
user_settings_cases:
  - case_name: "正常更改昵称-成功"
    nickname: "新的测试昵称"
    bio: ""
    expect_status: 200

  - case_name: "清空昵称-实际允许（返回200）"
    nickname: ""
    bio: ""
    expect_status: 200

  - case_name: "昵称超长-报错"
    nickname: "这是一个非常非常非常非常非常非常非常非常非常长的昵称测试用例"
    bio: ""
    expect_status: 200

  - case_name: "只改个人简介"
    nickname: "溯笙"
    bio: "这是我的全新个人简介！"
    expect_status: 200

notification_privacy_cases:
  # 我的主题标题被更改 (通知 & 邮件)
  - case_name: "开启-我的主题标题被更改(通知)"
    preference_key: "notify_discussionRenamed_alert"
    preference_value: true
    expect_status: 200
  - case_name: "关闭-我的主题标题被更改(通知)"
    preference_key: "notify_discussionRenamed_alert"
