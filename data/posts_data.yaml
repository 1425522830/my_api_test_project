post_management_cases:
  - case_name: "发帖-正向主流程"
    operate: "create"
    title: "接口自动化测试帖"
    content: "这是通过接口自动化测试发布的帖子内容。"
    tag_ids: ["dynamic_primary_tag_id"]
    expect_status: 201
  - case_name: "发帖-异常空标题"
    operate: "create"
    title: ""
    content: "有内容但没标题"
    tag_ids: ["dynamic_primary_tag_id"]
    expect_status: 422
  - case_name: "发帖-异常超长标题"
    operate: "create"
    title: "超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例超长标题测试用例"
    content: "测试超长标题边界"
    tag_ids: ["dynamic_primary_tag_id"]
    expect_status: 422
  - case_name: "发帖-异常缺少正文内容"
    operate: "create"
    title: "只有标题没有内容"
    content: ""
    tag_ids: ["dynamic_primary_tag_id"]
    expect_status: 422
  - case_name: "发帖-未登录-权限校验"
    operate: "create_unauth"
    title: "未登录发帖"
    content: "应该被拒绝"
    tag_ids: ["dynamic_primary_tag_id"]
    expect_status: 403
  - case_name: "发帖-缺失主分类Tag"
    operate: "create_no_tag"
    title: "不传分类"
    content: "验证缺失必须的关联数据"
    expect_status: 422
  - case_name: "列表浏览-默认排序"
    operate: "list"
    page_offset: 0
    sort: "-lastPostedAt"
    expect_status: 200
  - case_name: "列表浏览-正向排序"
    operate: "list"
    page_offset: 0
    sort: "lastPostedAt"
    expect_status: 200
  - case_name: "列表浏览-分页偏移翻页"
    operate: "list"
    page_offset: 10
    sort: "-lastPostedAt"
    expect_status: 200
  - case_name: "列表浏览-非法分页参数(负数)"
    operate: "list"
    page_offset: -1
    sort: "-lastPostedAt"
    expect_status: 400
  - case_name: "列表浏览-超大偏移量"
    operate: "list"
    page_offset: 99999
    sort: "-lastPostedAt"
    expect_status: 200
  - case_name: "详情查看-不存在的帖子"
    operate: "detail_not_found"
    discussion_id: 999999999
    expect_status: 404
  - case_name: "帖子模块-越权编辑测试"
    operate: "cross_user_edit"
    expect_status: 403